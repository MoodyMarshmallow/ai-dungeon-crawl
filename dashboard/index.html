<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Dungeon Crawl</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/assets/xterm.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <main class="workspace" id="workspace">
      <div class="left-workspace" id="left-workspace">
        <section class="game-pane" aria-label="Game screen">
          <div id="terminal">
            <div id="screen" aria-label="Current game screen"></div>
          </div>
        </section>
        <div
          class="resize-handle horizontal"
          id="row-handle"
          role="separator"
          aria-label="Resize game and REPL panes"
          aria-orientation="horizontal"
          tabindex="0"
        ></div>
        <section class="repl-pane" aria-label="Python REPL transcript">
          <div id="repl-terminal"></div>
        </section>
      </div>
      <div
        class="resize-handle vertical"
        id="column-handle"
        role="separator"
        aria-label="Resize model activity sidebar"
        aria-orientation="vertical"
        tabindex="0"
      ></div>
      <aside class="activity-pane" aria-label="Model activity">
        <div id="activity-scroll"><div id="activity"></div></div>
        <div id="error" role="alert" hidden></div>
        <div class="controls">
          <span id="status" role="status"></span>
          <button id="stop" disabled>Stop</button>
          <button id="start" disabled>Start</button>
        </div>
      </aside>
    </main>
  </body>
</html>
