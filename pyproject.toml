[project]
name = "ai-dungeon-crawl"
version = "0.1.0"
description = "An LLM-driven Python REPL harness for Dungeon Crawl Stone Soup"
readme = "README.md"
authors = [
    { name = "Milo Shan", email = "miloshan8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[openai,anthropic]>=2.40,<3"]

[project.scripts]
ai-dungeon-crawl = "ai_dungeon_crawl:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
